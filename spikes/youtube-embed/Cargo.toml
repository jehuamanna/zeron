# Throwaway spike: can Zeron's Tauri webview play an embedded YouTube player?
# Not a workspace member and not product code.
[package]
name = "youtube-embed-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[build-dependencies]
tauri-build = "=2.7.3"

[dependencies]
tauri = "=2.12.4"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
url = "2"
