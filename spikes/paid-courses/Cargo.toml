# Throwaway Phase 11 spike (ADR 0017). Not a workspace member and not product code.
[package]
name = "paid-courses-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["rozbb"]
# HPKE candidates. `cargo tree` per feature compares their dependency trees.
rozbb = ["dep:hpke"]
ng = ["dep:hpke-ng", "dep:rand_core"]

[dependencies]
anyhow = "1"
axum = "=0.8.9"
base64 = "0.22"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", features = ["rand_core"] }
futures-util = "=0.3.34"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
hkdf = "=0.13.0"
media-gateway = { path = "../../crates/media-gateway" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "net", "time", "sync", "process"] }

hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"], optional = true }
hpke-ng = { version = "=0.2.0", optional = true }
rand_core = { version = "0.10", optional = true }

[[bin]]
name = "hpke"
required-features = ["rozbb", "ng"]
