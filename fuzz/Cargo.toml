doc = false
bench = false

[[bin]]
name = "metainfo"
path = "fuzz_targets/metainfo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "range"
path = "fuzz_targets/range.rs"
test = false
doc = false
bench = false

[[bin]]
name = "release_signature"
path = "fuzz_targets/release_signature.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog"
path = "fuzz_targets/catalog.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transcript"
path = "fuzz_targets/transcript.rs"
test = false
doc = false
bench = false

[[bin]]
name = "configuration"
path = "fuzz_targets/configuration.rs"
test = false
