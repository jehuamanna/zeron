[package]
name = "zeron-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
course-format = { path = "../crates/course-format" }
course-signing = { path = "../crates/course-signing" }
learning-domain = { path = "../crates/learning-domain" }
media-gateway = { path = "../crates/media-gateway" }
publisher-application = { path = "../crates/publisher-application" }
torrent-metainfo = { path = "../crates/torrent-metainfo" }
serde_json = "=1.0.154"

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
