# Dependency policy, checked by `cargo deny check` in CI.

[graph]
all-features = false
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error is unmaintained. It is a build-time proc-macro used by
  # gtk-rs 0.18, which Tauri needs on Linux; nothing of it ships at run time.
  { id = "RUSTSEC-2024-0370", reason = "build-time only, through Tauri's GTK bindings" },
  # ringbuf < 0.5.2: double free when an element's Drop panics during skip or
  # clear. librqbit-utp 0.7.0 stores only u8, whose Drop cannot panic. Revisit
  # when librqbit moves to ringbuf 0.5.
  { id = "RUSTSEC-2026-0293", reason = "only u8 elements, whose Drop never panics" },
]

[licenses]
version = 2
# Permissive licenses compatible with distributing Zeron. Copyleft licenses
# need a decision first (roadmap approval question 5).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
]
confidence-threshold = 0.9
exceptions = [
  # MPL-2.0 (file-level copyleft) through Tauri's HTML tooling. Zeron ships
  # them unmodified; their source stays available from crates.io.
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
  { allow = ["MPL-2.0"], crate = "selectors" },
  { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
