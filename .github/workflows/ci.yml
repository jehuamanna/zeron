name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libdbus-1-dev pkg-config build-essential \
            gnome-keyring dbus-x11

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the frontend
        run: pnpm build

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-targets

      - name: Real keychain (macOS Keychain, Windows Credential Manager)
        if: runner.os != 'Linux'
        env:
          ZERON_KEYCHAIN_TESTS: "1"
        run: cargo test -p publisher-identity --test os_store -- --nocapture

      - name: Real keychain (Secret Service through GNOME Keyring)
        if: runner.os == 'Linux'
        env:
          ZERON_KEYCHAIN_TESTS: "1"
        run: |
          dbus-run-session -- bash -c '
            echo -n "ci-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test -p publisher-identity --test os_store -- --nocapture
          '

      - name: Frontend tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
