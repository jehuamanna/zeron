[package]
name = "zeron-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "zeron_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
base64.workspace = true
course-format = { path = "../../../crates/course-format" }
course-signing = { path = "../../../crates/course-signing" }
course-publisher = { path = "../../../crates/course-publisher" }
data-backup = { path = "../../../crates/data-backup" }
data-import = { path = "../../../crates/data-import" }
futures-util.workspace = true
learning-application = { path = "../../../crates/learning-application" }
learning-storage = { path = "../../../crates/learning-storage" }
media-gateway = { path = "../../../crates/media-gateway" }
port-mapping = { path = "../../../crates/port-mapping" }
publisher-application = { path = "../../../crates/publisher-application" }
publisher-identity = { path = "../../../crates/publisher-identity" }
publisher-storage = { path = "../../../crates/publisher-storage" }
reqwest.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
tokio.workspace = true
torrent-librqbit = { path = "../../../crates/torrent-librqbit" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_6"] }

[lints]
workspace = true
