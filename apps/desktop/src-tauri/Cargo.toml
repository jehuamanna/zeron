[package]
name = "zeron-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "zeron_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
course-format = { path = "../../../crates/course-format" }
learning-application = { path = "../../../crates/learning-application" }
