[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/course-access",
    "crates/course-format",
    "crates/course-publisher",
    "crates/course-signing",
    "crates/data-backup",
    "crates/data-import",
    "crates/learning-domain",
    "crates/learning-application",
    "crates/learning-storage",
    "crates/media-gateway",
    "crates/mutation-testing",
    "crates/port-mapping",
    "crates/publisher-identity",
    "crates/publisher-application",
    "crates/publisher-storage",
    "crates/torrent-librqbit",
    "crates/torrent-metainfo",
    "crates/torrent-port",
    "tools/course-cli",
    "tools/publisher-cli",
]
exclude = ["spikes", "fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
axum = "=0.8.9"
base64 = "=0.22.1"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
dbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }
ed25519-dalek = "=3.0.0"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
hkdf = "=0.13.0"
keyring-core = "=1.0.1"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
netdev = { version = "=0.46.3", default-features = false, features = ["gateway"] }
nix = { version = "=0.30.1", default-features = false, features = ["fs"] }
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls", "disable-upload"] }
schemars = "=1.2.3"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
semver = "=1.0.28"
sha1 = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tauri = "=2.12.4"
tauri-build = "=2.7.3"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls"] }
thiserror = "=2.0.21"
tokio = "=1.53.3"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-util = "=0.7.20"
tower-http = "=0.7.1"
unicode-normalization = "=0.1.25"
url = "=2.5.8"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
zeroize = "=1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
