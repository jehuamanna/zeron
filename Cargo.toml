[workspace]
members = [
    "apps/learner-desktop/src-tauri",
    "crates/course-format",
    "crates/course-publisher",
    "crates/learning-application",
    "crates/learning-storage",
    "crates/media-gateway",
    "tools/course-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
axum = "=0.8.9"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
schemars = "=1.2.3"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tauri = "=2.12.4"
tauri-build = "=2.7.3"
tauri-plugin-dialog = "=2.8.3"
thiserror = "=2.0.21"
tokio = "=1.53.3"
tokio-util = "=0.7.20"
tower-http = "=0.7.1"
unicode-normalization = "=0.1.25"
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
